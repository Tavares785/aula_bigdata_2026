name: "Correcao - Aula 12 (Ingestao e Pre-processamento)"

# Projeto livre por grupo -- o CI verifica apenas a estrutura: infra
# Terraform do pipeline (aws-lab/infra) completa, formatada e valida; ETL
# PySpark (aws-lab/job); REGRAS_SILVER.md e PROGRESS.md preenchidos. Nao
# acessa a AWS nem executa o pipeline.
on:
  pull_request:
    branches: [master]
    paths:
      - "aula-12-ingestao-preprocessamento/**"
      - ".github/workflows/ci-aula-12.yml"

permissions:
  contents: read

jobs:
  corrigir-lab:
    name: Verificar estrutura do pipeline e progresso
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aula-12-ingestao-preprocessamento

    steps:
      - name: Checkout do codigo da PR
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: aula-12-ingestao-preprocessamento/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Verificar estrutura da entrega
        shell: bash
        run: |
          set -o pipefail
          pytest -v --tb=short | tee test_output.txt

      - name: Validar Terraform (fmt + validate)
        if: always()
        shell: bash
        run: |
          set -o pipefail
          {
            terraform -chdir=aws-lab/infra fmt -check -diff
            terraform -chdir=aws-lab/infra init -backend=false -input=false
            terraform -chdir=aws-lab/infra validate
          } 2>&1 | tee terraform_output.txt

      - name: Publicar resumo da verificacao
        if: always()
        shell: bash
        run: |
          {
            echo "## Resultado da verificacao - Aula 12 (Ingestao e Pre-processamento)"
            echo ""
            echo '```'
            cat test_output.txt
            echo '```'
            echo ""
            echo "### Terraform"
            echo '```'
            cat terraform_output.txt 2>/dev/null || echo "sem saida"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
