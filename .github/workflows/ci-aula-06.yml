name: "Correcao - Aula 06 (Spark SQL e DataFrames)"

on:
  pull_request:
    branches: [main]
    paths:
      - "aula-06-spark-sql-dataframes/**"
      - ".github/workflows/ci-aula-06.yml"

permissions:
  contents: read

jobs:
  corrigir-lab:
    name: Rodar testes automaticos do lab
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo da PR
        uses: actions/checkout@v4

      - name: Build da imagem Docker do lab
        working-directory: aula-06-spark-sql-dataframes
        run: docker build -t lab-aula-06 .

      - name: Rodar testes (correcao automatica)
        working-directory: aula-06-spark-sql-dataframes
        run: |
          set -o pipefail
          docker run --rm lab-aula-06 pytest -v --tb=short | tee test_output.txt

      - name: Publicar resumo da correcao
        if: always()
        shell: bash
        working-directory: aula-06-spark-sql-dataframes
        run: |
          {
            echo "## Resultado da correcao automatica - Aula 06 (Spark SQL / DataFrames)"
            echo ""
            echo '```'
            cat test_output.txt 2>/dev/null || echo "Nenhum output de teste disponivel"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
