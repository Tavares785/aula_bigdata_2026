name: "Correcao - Aula 11 (Definicao e Planejamento do Projeto)"

# Este lab nao tem "resposta certa" (projeto livre por grupo) -- o CI
# verifica apenas conformidade estrutural: se a proposta foi de fato
# preenchida (secoes obrigatorias presentes, sem placeholders do
# template, com conteudo minimo) e se a infra Terraform do pipeline
# (aws-lab/infra) foi completada, formatada e e valida.
on:
  pull_request:
    branches: [master]
    paths:
      - "aula-11-planejamento-projeto/**"
      - ".github/workflows/ci-aula-11.yml"

permissions:
  contents: read

jobs:
  corrigir-lab:
    name: Verificar proposta do projeto
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aula-11-planejamento-projeto

    steps:
      - name: Checkout do codigo da PR
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: aula-11-planejamento-projeto/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Verificar estrutura da proposta e da infra
        shell: bash
        run: |
          set -o pipefail
          pytest -v --tb=short | tee test_output.txt

      - name: Validar Terraform (fmt + validate)
        if: always()
        shell: bash
        run: |
          set -o pipefail
          {
            terraform -chdir=aws-lab/infra fmt -check -diff
            terraform -chdir=aws-lab/infra init -backend=false -input=false
            terraform -chdir=aws-lab/infra validate
          } 2>&1 | tee terraform_output.txt

      - name: Publicar resumo da verificacao
        if: always()
        shell: bash
        run: |
          {
            echo "## Resultado da verificacao - Aula 11 (Proposta do Projeto)"
            echo ""
            echo '```'
            cat test_output.txt
            echo '```'
            echo ""
            echo "### Terraform"
            echo '```'
            cat terraform_output.txt 2>/dev/null || echo "sem saida"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
