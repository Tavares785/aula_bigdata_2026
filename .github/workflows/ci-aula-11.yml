name: "Correcao - Aula 11 (Definicao e Planejamento do Projeto)"

# Este lab nao tem "resposta certa" (projeto livre por grupo) -- o CI
# verifica apenas conformidade estrutural: se a proposta foi de fato
# preenchida (secoes obrigatorias presentes, sem placeholders do
# template, com conteudo minimo).
on:
  pull_request:
    branches: [main]
    paths:
      - "aula-11-planejamento-projeto/**"
      - ".github/workflows/ci-aula-11.yml"

permissions:
  contents: read

jobs:
  corrigir-lab:
    name: Verificar proposta do projeto
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aula-11-planejamento-projeto

    steps:
      - name: Checkout do codigo da PR
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: aula-11-planejamento-projeto/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Verificar estrutura da proposta
        shell: bash
        run: |
          set -o pipefail
          pytest -v --tb=short | tee test_output.txt

      - name: Publicar resumo da verificacao
        if: always()
        shell: bash
        run: |
          {
            echo "## Resultado da verificacao - Aula 11 (Proposta do Projeto)"
            echo ""
            echo '```'
            cat test_output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
