name: "Correcao - Aula 05 (Fundamentos do Spark)"

on:
  pull_request:
    branches: [master]
    paths:
      - "aula-05-spark-fundamentos/**"
      - ".github/workflows/ci-aula-05.yml"

permissions:
  contents: read

jobs:
  corrigir-lab:
    name: Rodar testes automaticos do lab
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo da PR
        uses: actions/checkout@v4

      - name: Build da imagem Docker do lab
        working-directory: aula-05-spark-fundamentos
        run: docker build -t lab-aula-05 .

      - name: Rodar testes (correcao automatica)
        working-directory: aula-05-spark-fundamentos
        run: |
          set -o pipefail
          docker run --rm lab-aula-05 pytest -v --tb=short | tee test_output.txt

      - name: Publicar resumo da correcao
        if: always()
        shell: bash
        working-directory: aula-05-spark-fundamentos
        run: |
          {
            echo "## Resultado da correcao automatica - Aula 05 (Spark RDDs)"
            echo ""
            echo '```'
            cat test_output.txt 2>/dev/null || echo "Nenhum output de teste disponivel"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
