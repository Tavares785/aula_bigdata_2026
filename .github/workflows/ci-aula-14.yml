name: "Correcao - Aula 14 (Visualizacao e Conclusao do Projeto)"

# Entrega final do projeto -- o CI verifica se o relatorio final foi
# preenchido e se o checklist de entregaveis foi totalmente marcado.
# A visualizacao em si (Zeppelin/Superset) e avaliada manualmente pelo
# professor a partir da evidencia anexada na PR.
on:
  pull_request:
    branches: [master]
    paths:
      - "aula-14-visualizacao-conclusao/**"
      - ".github/workflows/ci-aula-14.yml"

permissions:
  contents: read

jobs:
  corrigir-lab:
    name: Verificar relatorio final e checklist
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aula-14-visualizacao-conclusao

    steps:
      - name: Checkout do codigo da PR
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: aula-14-visualizacao-conclusao/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Verificar relatorio final
        shell: bash
        run: |
          set -o pipefail
          pytest -v --tb=short | tee test_output.txt

      - name: Publicar resumo da verificacao
        if: always()
        shell: bash
        run: |
          {
            echo "## Resultado da verificacao - Aula 14 (Relatorio Final)"
            echo ""
            echo '```'
            cat test_output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
