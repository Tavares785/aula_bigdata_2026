# Sobe um broker Kafka local para a pratica MANUAL deste lab (nao usado
# pelo CI/CD -- a correcao automatica testa apenas a logica pura, sem
# depender de um broker real, para ser rapida e confiavel).
#
# Como usar:
#   docker compose up -d
#   # produza/consuma mensagens no topico "eventos" usando kafka-python
#   docker compose down
version: "3.8"
services:
  kafka:
    image: bitnami/kafka:3.7
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      ALLOW_PLAINTEXT_LISTENER: "yes"
